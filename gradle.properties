# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Локальный JDK 21 и пути toolchain настраиваются в пользовательском файле:
#   Windows: C:\Users\<user>\.gradle\gradle.properties
#   Linux/Mac: ~/.gradle/gradle.properties
# Проектный gradle.properties остаётся портативным — в CI (Linux)
# GitHub Actions ставит JDK 21 через actions/setup-java@v4, и
# org.gradle.java.installations.auto-download=true подхватывает её
# автоматически. На Windows auto-download из foojay.io ломался, поэтому
# локальный конфиг задаёт пути вручную.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# В AGP 9.x Kotlin встроен в Android Gradle Plugin, и AGP запрещает
# KSP добавлять сгенерированные kotlin-исходники в kotlin.sourceSets
# (используется android.sourceSets). Этот флаг разрешает совместную
# работу KSP + встроенного Kotlin — без него сборка падает с:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed
#    with built-in Kotlin."
android.disallowKotlinSourceSets=false
